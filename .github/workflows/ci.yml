name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  browser:
    # Keep the runner compatible with the pinned Playwright browser build.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
  python-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python3 -m pip install .
      - run: python3 -c "import fit_explorer; assert callable(fit_explorer.save_fit_root)"
      - run: fit-explorer-demo --help
