[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fit-explorer"
version = "0.1.3"
description = "Save and explore self-contained two-dimensional RooFit models"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "LICENSES/*.txt"]
authors = [{name = "Fit Explorer contributors"}]
keywords = ["RooFit", "ROOT", "visualization", "fitting"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Visualization",
  "Operating System :: OS Independent",
]

[project.scripts]
fit-explorer-demo = "fit_explorer.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true
